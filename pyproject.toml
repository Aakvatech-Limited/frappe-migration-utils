[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "frappe-migration-utils"
version = "0.1.0"
description = "One-time JSON migration helpers for Frappe applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aakvatech Limited", email = "info@aakvatech.com"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1", "twine>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/frappe_migration_utils"]

[tool.ruff]
target-version = "py310"
line-length = 110
